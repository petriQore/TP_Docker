# Part 3 - SOLUTION to the scaling problem: a Load Balancer (Nginx) in front.
# Only Nginx publishes a host port. The "web" replicas publish NOTHING, so
# there is no port conflict and we can scale to as many instances as we want.
#   docker compose -f docker-compose.lb.yml up -d --build --scale web=3
services:
  web:
    build: .
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    expose:
      - "${APP_PORT}"                  # reachable only inside app-network
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - APP_PORT=${APP_PORT}
    depends_on:
      - db-service
    networks:
      - app-network
    restart: unless-stopped

  loadbalancer:
    image: nginx:alpine
    ports:
      - "${WEB_PORT}:80"               # the ONLY published port
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - app-network
    restart: unless-stopped

  db-service:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
