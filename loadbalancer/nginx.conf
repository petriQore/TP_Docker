# Docker's embedded DNS (127.0.0.11) returns ALL the IPs of the "web" replicas.
# Re-resolving every 5s lets Nginx see replicas that are added/removed.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        set $backend http://web:5000;   # variable => resolved at request time
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
